<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/owsj/assets/css/reset.css">
    <link rel="stylesheet" href="/owsj/assets/css/main.css">
    <link rel="icon" href="/owsj/assets/images/icons/owsj-icon-house-white.png">
    <title>Home - OWSJ Oficina Web São José</title>
    <style>
/* ///// Main ///// */

.site-hero {
    height: 100vh;
    display: flex;
    align-items: center;
}
.site-hero .container {
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 20px;
}
.site-hero .row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem;
}
.site-hero .col {
    display: flex;
    align-items: center;
}
.site-hero .logo {
    width: 8rem;
    height: 8rem;
    border: 4px solid var(--beige-light-2);
    border-radius: 50%;
}
.site-hero .letreiro {
    text-transform: none;
    font-family: "Times New Roman";
    font-size: 2.1rem;
    line-height: 1;
    letter-spacing: 1px;
    text-align: center;
}
.nowrap {
    white-space: nowrap;
}
.index-section {
    margin-bottom: 30vh;
    margin-top: -10vh;
}
.index-section .container {
    max-width: 400px;
    margin: auto;
    padding: 0 32px;
    margin-bottom: 240px;
}
.index-section .content {
    text-align: center;
    font-family: "Montserrat";
}
.index-section .content>* {
    margin-bottom: .4rem;
}
.index-section .content a {
    transition: .5s;
}
.index-section .content a:hover {
    color: var(--beige-dark);
    opacity: 90%;
    transition: .5s;
}
.index-section .content .title {
    font-family: "Pathway Gothic One";
    font-size: 1.9rem;
    font-weight: 400;
}
.index-section .content .items {
    font-weight: 600;
}
/* small */
@media (min-width: 576px) {
}
/* medium */
@media (min-width: 768px) {    
    .site-hero .row {
        gap: 2rem;
    }
    .site-hero .logo {
        height: 11rem;
        width: 11rem;
    }
    .site-hero .letreiro {
        font-size: 2.3rem;
    }
}
/* large */
/* @media (min-width: 992px) {
    .site-hero .row {
        gap: 2rem;
    }
    .site-hero .logo {
        height: 13rem;
        width: 13rem;
    }
    .site-hero .letreiro {
        font-size: 2.9rem;
    }
} */

/* Estado inicial (invisível) */
.oculto {
  opacity: 0;
  transform: translateY(30px); /* Dá um efeito suave de subida ao aparecer */
  transition: opacity 1.2s ease-out, transform 1.2s ease-out;
}

/* Estado final (visível) */
.oculto.visivel {
  opacity: 1;
  transform: translateY(0);
}
    </style>
</head>
<body>
    <div class="header-wrapper">
        <header class="site-header">
            <div class="com-bar">
                <div class="bar-row">
                    <a class="bar-col left-bar-col" href="/owsj/index.html"><span><img src="/owsj/assets/images/icons/owsj-icon-home.png" alt="" class="logo"></span><span>Home</span></a>
                    <a class="bar-col site-name" href="/owsj/index.html">www.owsj.com.br</a>
                    <button class="bar-col right-bar-col menu-button" onclick="document.querySelector('.menu-screen').classList.toggle('active')" ><span>Menu</span><span class="menu-burger"><div class="bar"></div><div class="bar"></div><div class="bar"></div></span></button>
                </div>
            </div>
        </header>
        <div class="menu-screen">
            <aside class="site-menu">
                <div class="com-bar">
                    <div class="bar-row">
                        <a href="/owsj/index.html" class="bar-col center-bar-col"><img src="/owsj/assets/images/icons/owsj-icon-black.png" class="logo" alt="">
                    </a>
                        <div class="bar-col right-bar-col">
                            <button  class="menu-x" onclick="document.querySelector('.menu-screen').classList.toggle('active')"><div class="bar"></div><div class="bar"></div></button>
                        </div>
                    </div>
                </div>
                <div class="menu-section--black">
                    <a class="sim-bar" href="/owsj/index.html">Home</a>
                    <a class="sim-bar">Contato</a>
                    <a class="sim-bar">Canal do YouTube</a>
                    <br>
                </div>
                <div class="menu-section--white">
                    <a href="/owsj/estudo/index.html" class="sim-bar title">Estudo</a>
                    <ul>
                        <a href="/owsj/estudo/introducao-web-frontend/index.html" class="sim-bar item"><li>&#9642; Minicurso de Introdução de Desenvolvimento Web</li></a>
                    </ul>
                    <!-- <a href="/owsj#" class="sim-bar title">Ferramentas</a>
                    <ul>
                        <a href="/owsj#" class="sim-bar item"><li>&#9642; Troca-Trechos</li></a>
                    </ul> -->
                </div>
                
            </aside>
            <button class="close-menu" onclick="document.querySelector('.menu-screen').classList.toggle('active')"></button>
        </div>
    </div>
    
<main>
    <div class="site-hero">
        <div class="md-container">
            <div class="row">
                <div class="col">
                    <div class="logo"></div>
                </div>
                <div class="col">
                    <h1 class="letreiro oculto">Oficina Web<br>São José</h1>
                </div>
            </div>
        </div>
    </div>
    <section class="index-section">
        <div class="ph-container">
            <div class="content oculto">
                <h1 class="title"><a href="/owsj/estudo/index.html">Estudo</a></h1>
                <ul class="items">
                    <li><a href="/owsj/estudo/introducao-web-frontend/index.html">&#9642; Minicurso de Introdução de Desenvolvimento Web Frontend</a></li>
                </ul>
                <!-- <h1 class="title"><a href="/owsj">Ferramentas</a></h1>
                <ul class="items">
                    <li><a href="/owsj">&#9642; Troca-Trechos</a></li>
                </ul> -->
            </div>
        </div>
    </section>
</main>

    <footer class="site-footer">
        Oficina Web São José
    </footer>
    <script src="/owsj/assets/js/text.js"></script>
</body>
</html>
